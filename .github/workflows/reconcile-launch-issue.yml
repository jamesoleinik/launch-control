name: Reconcile completed launch issue

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: read

concurrency:
  group: launch-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      vars.LC_FIXER_ENABLED == 'true' &&
      github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    environment: launch-reconciliation
    permissions:
      contents: read
      issues: read
      id-token: write
    env:
      PYTHONIOENCODING: utf-8
      LC_FIXER_CONFIG: ${{ vars.LC_FIXER_CONFIG }}
      LC_FIXER_CLIENT_ID: ${{ vars.LC_FIXER_CLIENT_ID }}
      LC_FIXER_TENANT_ID: ${{ vars.LC_FIXER_TENANT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify boundary offline
        run: python -m unittest discover -s scripts/python/tests -p test_reconcile_launch_issue.py
      - name: Install managed Dataverse CLI
        run: npm install --global @microsoft/dataverse@1.0.81
      - name: Authenticate dedicated application using federation
        shell: bash
        run: |
          environment_url="$(python -c 'import json,os; print(json.loads(os.environ["LC_FIXER_CONFIG"])["environment_url"])')"
          dataverse auth create --name launch-reconciliation \
            --environment "$environment_url" --tenant "$LC_FIXER_TENANT_ID" \
            --applicationId "$LC_FIXER_CLIENT_ID" --githubFederated --accept-cleartext-caching
      - name: Reconcile allowlisted issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/python/reconcile_launch_issue.py --apply
      - name: Remove ephemeral authentication profile
        if: always()
        run: dataverse auth remove --name launch-reconciliation
